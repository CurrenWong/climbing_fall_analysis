[project]
name = "climbing-fall-analysis"
version = "0.1.0"
description = "攀岩坠落摔伤仿真 — Phase 1 (绳索 1D) / Phase B-1 (抱石 1D)"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "matplotlib>=3.8",
    "pandas>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/climbing"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
