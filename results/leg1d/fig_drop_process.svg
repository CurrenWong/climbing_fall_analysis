<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="980" viewBox="0 0 1200 980" font-family="Helvetica,Arial,sans-serif">
<rect width="1200" height="980" fill="#ffffff"/>
<text x="40" y="38" font-size="22" font-weight="bold" fill="#111">V1 · 我们计算的掉落过程（2026-10-17 定稿）</text>
<text x="40" y="62" font-size="14" fill="#555">结论：首折高度不是常数，而是缓冲行程 s 的函数 —— h* ≈ 7.9·s（R=2）</text>

<!-- ================= PANEL A : 掉落过程 ================= -->
<rect x="30" y="85" width="620" height="345" fill="#fafafa" stroke="#ccc"/>
<text x="45" y="110" font-size="15" font-weight="bold" fill="#222">A · 掉落过程的四个阶段</text>

<!-- 自由落体 -->
<rect x="70" y="130" width="260" height="215" fill="none" stroke="#e0e0e0" stroke-dasharray="4 3"/>
<text x="78" y="148" font-size="12" fill="#888">① 自由落体  v=√(2gh)</text>
<circle cx="200" cy="185" r="13" fill="#4a6fa5"/>
<line x1="200" y1="198" x2="200" y2="248" stroke="#4a6fa5" stroke-width="5"/>
<line x1="200" y1="215" x2="176" y2="232" stroke="#4a6fa5" stroke-width="4"/>
<line x1="200" y1="215" x2="224" y2="232" stroke="#4a6fa5" stroke-width="4"/>
<line x1="190" y1="248" x2="200" y2="262" stroke="#4a6fa5" stroke-width="4"/>
<line x1="210" y1="248" x2="200" y2="262" stroke="#4a6fa5" stroke-width="4"/>
<text x="222" y="200" font-size="13" fill="#4a6fa5">躯干（80 kg）</text>
<path d="M 200 200 L 200 320" stroke="#c0392b" stroke-width="2" marker-end="url(#arr)"/>
<defs><marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#c0392b"/></marker></defs>
<text x="215" y="300" font-size="12" fill="#c0392b">h</text>

<!-- 地面 -->
<line x1="50" y1="345" x2="340" y2="345" stroke="#333" stroke-width="3"/>
<text x="48" y="362" font-size="12" fill="#333">刚性地面</text>

<!-- 接触 + 行程 -->
<line x1="380" y1="130" width="0" />
<text x="360" y="128" font-size="12" fill="#888">②③ 缓冲压缩（行程 s）</text>
<rect x="400" y="180" width="26" height="18" fill="#8a6a4a" stroke="#5a4632"/>
<text x="432" y="194" font-size="12" fill="#5a4632">跟骨（heel-first，COP 在此）</text>
<line x1="413" y1="180" x2="413" y2="120" stroke="#c0392b" stroke-width="2"/>
<line x1="405" y1="120" x2="421" y2="120" stroke="#c0392b" stroke-width="2"/>
<line x1="405" y1="180" x2="421" y2="180" stroke="#c0392b" stroke-width="2"/>
<text x="432" y="132" font-size="13" font-weight="bold" fill="#c0392b">s = 0.10 – 0.55 m</text>
<text x="432" y="150" font-size="12" fill="#c0392b">（真实跌落的缓冲行程）</text>
<rect x="413" y="120" width="14" height="60" fill="#f9d5d5"/>
<line x1="427" y1="180" x2="490" y2="180" stroke="#27ae60" stroke-width="2" marker-end="url(#arr2)"/>
<defs><marker id="arr2" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#27ae60"/></marker></defs>
<text x="470" y="172" font-size="12" fill="#27ae60">压缩 s</text>
<circle cx="413" cy="108" r="11" fill="#4a6fa5"/>
<line x1="413" y1="119" x2="413" y2="155" stroke="#4a6fa5" stroke-width="4"/>
<line x1="402" y1="130" x2="424" y2="130" stroke="#4a6fa5" stroke-width="3"/>
<text x="432" y="100" font-size="12" fill="#4a6fa5">躯干</text>
<line x1="380" y1="345" x2="620" y2="345" stroke="#333" stroke-width="3"/>

<!-- 行程上限说明 -->
<rect x="360" y="250" width="270" height="62" fill="#fff8e1" stroke="#e0b400"/>
<text x="370" y="270" font-size="12" font-weight="bold" fill="#8a6d00">⚠ 0.85 m 不是行程</text>
<text x="370" y="288" font-size="11.5" fill="#8a6d00">它是「躯干在脚之上的高度」（leg_ext0），</text>
<text x="370" y="304" font-size="11.5" fill="#8a6d00">属几何上限；生理屈曲上限约 0.55 m</text>

<text x="45" y="392" font-size="12.5" fill="#333">④ 若 F_peak ≥ 6.2 kN（跟骨阈值）→ 骨折；否则靠肌肉做功耗散</text>
<text x="45" y="412" font-size="12.5" fill="#333">肌肉做功已按 Zhang 2000 三高度实测标定（阻尼有上限，非无上限粘性）</text>

<!-- ================= PANEL B : 力-行程曲线族 ================= -->
<rect x="670" y="85" width="500" height="345" fill="#fafafa" stroke="#ccc"/>
<text x="685" y="110" font-size="15" font-weight="bold" fill="#222">B · 力 = 能量 ÷ 行程（横轴 s，纵轴跟骨受力）</text>
<!-- axes -->
<line x1="720" y1="440" x2="1170" y2="440" stroke="#333" stroke-width="2"/>
<line x1="720" y1="440" x2="720" y2="125" stroke="#333" stroke-width="2"/>
<text x="1130" y="462" font-size="12" fill="#333">s (m)</text>
<text x="668" y="135" font-size="12" fill="#333" transform="rotate(-90,668,135)">F (kN)</text>
<g font-size="10" fill="#666">
  <text x="716" y="455" text-anchor="end">0.05</text><text x="756" y="455" text-anchor="end">0.1</text>
  <text x="836" y="455" text-anchor="end">0.2</text><text x="916" y="455" text-anchor="end">0.3</text>
  <text x="996" y="455" text-anchor="end">0.4</text><text x="1076" y="455" text-anchor="end">0.5</text>
  <text x="1156" y="455" text-anchor="end">0.6</text>
</g>
<g stroke="#eee"><line x1="720" y1="440" x2="1160" y2="440"/><line x1="720" y1="360" x2="1160" y2="360"/><line x1="720" y1="280" x2="1160" y2="280"/><line x1="720" y1="200" x2="1160" y2="200"/></g>
<g font-size="10" fill="#666" text-anchor="end">
  <text x="714" y="444">0</text><text x="714" y="364">5</text><text x="714" y="284">10</text><text x="714" y="204">15</text><text x="714" y="124">20</text>
</g>
<!-- threshold -->
<line x1="720" y1="341" x2="1160" y2="341" stroke="#c0392b" stroke-width="2" stroke-dasharray="6 4"/>
<text x="1165" y="345" font-size="11" fill="#c0392b">6.2 kN</text>
<!-- curves F=785h/s -->
<polyline points="720,189 760,314 840,377 920,398 1000,409 1080,415 1160,419" fill="none" stroke="#7f8c8d" stroke-width="2"/>
<polyline points="720,125 760,189 840,314 920,356 1000,377 1080,390 1160,398" fill="none" stroke="#2980b9" stroke-width="2"/>
<polyline points="720,125 760,125 840,189 920,272 1000,314 1080,339 1160,356" fill="none" stroke="#27ae60" stroke-width="2"/>
<polyline points="720,125 760,125 840,125 920,189 1000,251 1080,290 1160,314" fill="none" stroke="#8e44ad" stroke-width="2"/>
<g font-size="11" fill="#333">
  <text x="770" y="332" fill="#7f8c8d">h=1 m</text>
  <text x="800" y="300" fill="#2980b9">h=2 m</text>
  <text x="1040" y="336" fill="#27ae60">h=4 m</text>
  <text x="1010" y="248" fill="#8e44ad">h=6 m</text>
</g>
<text x="690" y="478" font-size="12" fill="#c0392b">→ 同一高度，行程越短力越大；短行程 = 低高度就骨折</text>

<!-- ================= PANEL C : h* vs s ================= -->
<rect x="30" y="500" width="1140" height="450" fill="#fafafa" stroke="#ccc"/>
<text x="45" y="525" font-size="15" font-weight="bold" fill="#222">C · 首折高度 h* 作为缓冲行程 s 的函数（能量法 h* = F·s /(R·m·g)）</text>
<!-- band 6-9 -->
<rect x="100" y="666" width="1000" height="78" fill="#fdebd0" stroke="#e0b400" stroke-dasharray="5 4"/>
<text x="1075" y="700" font-size="13" font-weight="bold" fill="#8a6d00">[Y25] 目标带 6–9 m</text>
<!-- axes: y 900=0m, 640=10m => 26px/m ; x 100=s0.1, 1100=s0.6 -->
<line x1="100" y1="900" x2="1120" y2="900" stroke="#333" stroke-width="2"/>
<line x1="100" y1="900" x2="100" y2="640" stroke="#333" stroke-width="2"/>
<g stroke="#eee"><line x1="100" y1="900" x2="1100" y2="874"/><line x1="100" y1="848" x2="1100" y2="848"/><line x1="100" y1="822" x2="1100" y2="822"/><line x1="100" y1="796" x2="1100" y2="796"/><line x1="100" y1="770" x2="1100" y2="770"/><line x1="100" y1="744" x2="1100" y2="744"/><line x1="100" y1="718" x2="1100" y2="718"/><line x1="100" y1="692" x2="1100" y2="692"/><line x1="100" y1="666" x2="1100" y2="666"/></g>
<g font-size="11" fill="#666" text-anchor="end">
  <text x="94" y="904">0</text><text x="94" y="852">2</text><text x="94" y="800">4</text>
  <text x="94" y="748">6</text><text x="94" y="696">8</text><text x="94" y="644">10</text>
</g>
<g font-size="11" fill="#666" text-anchor="middle">
  <text x="100" y="920">0.10</text><text x="300" y="920">0.20</text><text x="500" y="920">0.30</text>
  <text x="700" y="920">0.40</text><text x="900" y="920">0.50</text><text x="1100" y="920">0.55</text>
  <text x="1130" y="920">0.60</text>
</g>
<text x="1050" y="938" font-size="12" fill="#333">缓冲行程 s (m)</text>
<text x="60" y="780" font-size="12" fill="#333" transform="rotate(-90,60,780)">首折高度 h* (m)</text>
<!-- R=2 line -->
<polyline points="100,879 300,859 500,838 700,818 900,797 1100,787" fill="none" stroke="#2980b9" stroke-width="3"/>
<!-- R=1.3 line -->
<polyline points="100,873 300,846 500,819 700,795 900,766 1100,744" fill="none" stroke="#c0392b" stroke-width="3"/>
<g font-size="12">
  <text x="140" y="866" fill="#2980b9">R = 2.0（线性弹簧，力峰在末段）</text>
  <text x="140" y="856" fill="#2980b9">h* ≈ 7.9·s</text>
  <text x="700" y="788" fill="#c0392b">R = 1.3（肌肉阻尼主导，力曲线平坦）</text>
  <text x="700" y="778" fill="#c0392b">h* ≈ 12.1·s</text>
</g>
<!-- markers -->
<circle cx="100" cy="879" r="4" fill="#111"/><text x="60" y="884" font-size="11" fill="#111">刚性硬着陆</text>
<circle cx="1100" cy="787" r="4" fill="#111"/><text x="1035" y="806" font-size="11" fill="#111">深蹲极限</text>
<text x="45" y="944" font-size="12.5" fill="#333">⇒ 真实跌落首折 ≈ 1.2–6.7 m；目标带 6–9 m 只在「行程≥0.55 m 且 R=1.3」的极端角落被触及</text>
</svg>
